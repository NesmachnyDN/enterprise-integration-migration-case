<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cutover and rollback</title>
  <desc id="desc">Architecture-level cutover validation and rollback decision flow</desc>
  <rect width="1600" height="900" fill="#f7fbff"/>
  <rect width="1600" height="92" fill="#071a3a"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="58" font-size="34" font-weight="700" fill="#fff">CUTOVER &amp; ROLLBACK · управляемое производственное переключение</text>
    <text x="64" y="132" font-size="21" fill="#36536f">Rollback рассматривается как часть архитектуры миграции, а не как аварийная импровизация</text>

    <g fill="#fff" stroke="#a9cce7" stroke-width="2">
      <rect x="80" y="250" width="190" height="84" rx="19"/>
      <rect x="320" y="250" width="190" height="84" rx="19"/>
      <rect x="560" y="250" width="190" height="84" rx="19"/>
      <rect x="800" y="250" width="190" height="84" rx="19"/>
      <rect x="1040" y="250" width="190" height="84" rx="19"/>
    </g>
    <g fill="#173c62" text-anchor="middle" font-size="17" font-weight="700">
      <text x="175" y="283">Freeze legacy</text><text x="175" y="307" font-size="14" font-weight="400">configuration</text>
      <text x="415" y="283">Activate target</text><text x="415" y="307" font-size="14" font-weight="400">endpoint &amp; route</text>
      <text x="655" y="283">Send controlled</text><text x="655" y="307" font-size="14" font-weight="400">test message</text>
      <text x="895" y="283">Technical</text><text x="895" y="307" font-size="14" font-weight="400">validation</text>
      <text x="1135" y="283">Business</text><text x="1135" y="307" font-size="14" font-weight="400">validation</text>
    </g>
    <g stroke="#5a9dcc" stroke-width="3" fill="none">
      <path d="M270 292H320M510 292H560M750 292H800M990 292H1040"/>
    </g>

    <polygon points="1360,242 1450,292 1360,342 1270,292" fill="#0b4e91"/>
    <text x="1360" y="286" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">SUCCESS?</text>
    <text x="1360" y="309" font-size="13" fill="#d9efff" text-anchor="middle">acceptance gate</text>
    <path d="M1230 292H1270" stroke="#5a9dcc" stroke-width="3" fill="none"/>

    <path d="M1360 342V455" stroke="#4b98cb" stroke-width="3" fill="none"/>
    <text x="1384" y="405" font-size="17" font-weight="700" fill="#2573a8">YES</text>
    <rect x="1222" y="455" width="276" height="112" rx="22" fill="#dff2ff" stroke="#79b4dd" stroke-width="2"/>
    <text x="1360" y="495" font-size="20" font-weight="700" fill="#143b62" text-anchor="middle">Accept migration</text>
    <text x="1360" y="526" font-size="16" fill="#36536f" text-anchor="middle">monitor → stabilize →</text>
    <text x="1360" y="550" font-size="16" fill="#36536f" text-anchor="middle">decommission legacy later</text>

    <path d="M1270 292H1110Q1075 292 1075 327V470" stroke="#6e8294" stroke-width="3" fill="none"/>
    <text x="1130" y="274" font-size="17" font-weight="700" fill="#657c8f">NO</text>
    <rect x="905" y="470" width="340" height="132" rx="22" fill="#eef2f5" stroke="#b8c7d2" stroke-width="2"/>
    <text x="1075" y="510" font-size="20" font-weight="700" fill="#354f64" text-anchor="middle">Rollback</text>
    <text x="1075" y="541" font-size="16" fill="#556d80" text-anchor="middle">stop target flow · restore legacy</text>
    <text x="1075" y="566" font-size="16" fill="#556d80" text-anchor="middle">validate restoration · capture evidence</text>

    <rect x="80" y="460" width="710" height="212" rx="25" fill="#edf6fc"/>
    <text x="116" y="506" font-size="22" font-weight="700" fill="#173c62">Readiness gates before opening the change window</text>
    <g fill="#36536f" font-size="17">
      <text x="116" y="549">• фактическая конфигурация подтверждена</text>
      <text x="116" y="583">• зависимости и владельцы определены</text>
      <text x="116" y="617">• target route, доступы и мониторинг готовы</text>
      <text x="430" y="549">• тестовые данные подготовлены</text>
      <text x="430" y="583">• окно изменений согласовано</text>
      <text x="430" y="617">• rollback path проверен и имеет владельца</text>
    </g>

    <rect x="80" y="730" width="1420" height="102" rx="22" fill="#eaf4fb"/>
    <text x="116" y="774" font-size="19" font-weight="700" fill="#173c62">Архитектурный критерий приемки</text>
    <text x="116" y="808" font-size="17" fill="#36536f">Переключение считается завершенным только после технической и бизнес-проверки; до этого legacy-path остается частью контролируемого recovery design.</text>
  </g>
</svg>
