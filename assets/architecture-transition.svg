<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Transition architecture</title>
  <desc id="desc">Coexistence of legacy and target integration platforms through a temporary compatibility bridge</desc>
  <rect width="1600" height="900" fill="#f7fbff"/>
  <rect width="1600" height="92" fill="#071a3a"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="64" y="58" font-size="34" font-weight="700" fill="#fff">TRANSITION · управляемое сосуществование</text>
    <text x="64" y="132" font-size="21" fill="#36536f">Переходное состояние позволяет системам мигрировать независимо, не превращая временный контур в постоянную архитектуру</text>

    <rect x="62" y="185" width="510" height="560" rx="28" fill="#eef4f8" stroke="#bdcfdd" stroke-width="2"/>
    <text x="98" y="230" font-size="24" font-weight="700" fill="#445d71">LEGACY DOMAIN</text>
    <text x="98" y="260" font-size="17" fill="#687f91">Еще не мигрировавшие участники</text>

    <g fill="#fff" stroke="#b8c9d6" stroke-width="2">
      <rect x="104" y="330" width="190" height="78" rx="17"/>
      <rect x="104" y="492" width="190" height="78" rx="17"/>
      <rect x="340" y="330" width="180" height="78" rx="17"/>
      <rect x="340" y="492" width="180" height="78" rx="17"/>
    </g>
    <g fill="#324e65" font-size="18" font-weight="700" text-anchor="middle">
      <text x="199" y="377">Application A</text>
      <text x="199" y="539">Application B</text>
      <text x="430" y="377">Legacy Endpoint</text>
      <text x="430" y="539">Shared Endpoint</text>
    </g>
    <rect x="245" y="616" width="230" height="82" rx="19" fill="#6c8295"/>
    <text x="360" y="648" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Legacy Messaging</text>
    <text x="360" y="674" font-size="16" fill="#e9f0f5" text-anchor="middle">Platform</text>

    <rect x="648" y="334" width="304" height="228" rx="30" fill="#0c2f5f" stroke="#8ec5ff" stroke-width="3"/>
    <text x="800" y="390" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">Compatibility Bridge</text>
    <text x="800" y="427" font-size="17" fill="#b9dfff" text-anchor="middle">temporary coexistence capability</text>
    <line x1="700" y1="466" x2="900" y2="466" stroke="#6ca9d7" stroke-width="2"/>
    <text x="800" y="503" font-size="17" fill="#d8edff" text-anchor="middle">explicit owner · exit criteria</text>
    <text x="800" y="531" font-size="17" fill="#d8edff" text-anchor="middle">no new integrations</text>

    <rect x="1028" y="185" width="510" height="560" rx="28" fill="#eaf6ff" stroke="#8fc3e8" stroke-width="2"/>
    <text x="1064" y="230" font-size="24" font-weight="700" fill="#0b4e91">TARGET DOMAIN</text>
    <text x="1064" y="260" font-size="17" fill="#4a7295">Уже мигрировавшие участники</text>

    <rect x="1090" y="330" width="190" height="78" rx="17" fill="#fff" stroke="#9bc9ea" stroke-width="2"/>
    <rect x="1090" y="492" width="190" height="78" rx="17" fill="#fff" stroke="#9bc9ea" stroke-width="2"/>
    <rect x="1320" y="330" width="160" height="78" rx="17" fill="#d9f0ff" stroke="#79b5df" stroke-width="2"/>
    <rect x="1320" y="492" width="160" height="78" rx="17" fill="#d9f0ff" stroke="#79b5df" stroke-width="2"/>
    <g fill="#173c62" font-size="18" font-weight="700" text-anchor="middle">
      <text x="1185" y="377">Application C</text>
      <text x="1185" y="539">Application D</text>
      <text x="1400" y="367">Lightweight</text><text x="1400" y="391">Agent</text>
      <text x="1400" y="529">Lightweight</text><text x="1400" y="553">Agent</text>
    </g>
    <rect x="1125" y="616" width="300" height="82" rx="19" fill="#0b4e91"/>
    <text x="1275" y="648" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Enterprise Integration</text>
    <text x="1275" y="674" font-size="16" fill="#d7ecff" text-anchor="middle">Platform</text>

    <g stroke-width="3" fill="none">
      <path d="M294 369H340M294 531H340M430 408V616M430 570V616" stroke="#879baa"/>
      <path d="M475 657H620Q648 657 648 629V545" stroke="#5b87aa"/>
      <path d="M952 448H1004Q1028 448 1028 472V657H1125" stroke="#4a91c6"/>
      <path d="M1280 369H1320M1280 531H1320M1400 408V616M1400 570V616" stroke="#5aa3d8"/>
    </g>

    <g>
      <rect x="64" y="785" width="1472" height="74" rx="20" fill="#edf6fc"/>
      <text x="96" y="830" font-size="19" fill="#36536f">Ключевой принцип: bridge существует только для разрыва зависимости между окнами миграции и удаляется после вывода legacy-контуров.</text>
    </g>
  </g>
</svg>
