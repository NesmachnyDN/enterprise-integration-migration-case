<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Target integration architecture</title>
  <desc id="desc">Synthetic target architecture with lightweight agents and reusable enterprise integration capabilities</desc>
